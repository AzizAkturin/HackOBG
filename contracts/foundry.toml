[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
use_literal_content = true
chain_id = 10143

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
monad_testnet = { key = "${MONADSCAN_KEY}", chain = 10143, url = "https://api.etherscan.io/v2/api?chainid=10143" }

[fuzz]
runs = 1000
